<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1412">
  <title>Villa Layos · Panel de proyecto</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/app.css?v=20260925-1">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-kicker">Layos Golf · Toledo</div>
      <h1>Villa Layos</h1>
      <p>Parcela, viabilidad, topografía y vivienda industrializada.</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <footer>
      <div class="mini-label"><span>Documentación crítica</span><strong id="docProgress">0%</strong></div>
      <div class="meter"><span id="docProgressBar"></span></div>
      <div class="mini-label"><span>Timeline del proyecto</span><strong id="planProgress">0%</strong></div>
      <div class="meter project"><span id="planProgressBar"></span></div>
      <div class="designer-credit">Diseñado por Yakoba Moreno</div>
    </footer>
  </aside>

  <div class="mobilebar">
    <button class="hamburger" id="menuButton" type="button" aria-label="Abrir navegación"><span></span><span></span><span></span></button>
    <strong id="mobileTitle">Inicio</strong>
  </div>
  <div class="overlay" id="overlay"></div>

  <main class="content">
    <section class="view active" id="inicio"></section>
    <section class="view" id="resumen"></section>
    <section class="view" id="parcelas"></section>
    <section class="view" id="ficha"></section>
    <section class="view" id="comparativa"></section>
    <section class="view" id="costes"></section>
    <section class="view" id="topografia"></section>
    <section class="view" id="vivienda"></section>
    <section class="view" id="modelos"></section>
    <section class="view" id="simulador"></section>
    <section class="view" id="viabilidad"></section>
    <section class="view" id="entrevistas"></section>
    <section class="view" id="documentacion"></section>
    <section class="view" id="plan"></section>
    <section class="view" id="ayuda"></section>
    <section class="view" id="about"></section>
  </main>

  <script src="assets/app.js?v=20260925-1"></script>
</body>
</html>
